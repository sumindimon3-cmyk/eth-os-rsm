name: Build RSM eth-os

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Downgrade cmdline-tools
        run: |
          sudo rm -rf $ANDROID_HOME/cmdline-tools
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdtools.zip
          unzip -q cmdtools.zip -d $ANDROID_HOME/cmdline-tools/
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Install SDK + NDK 22
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-33" "build-tools;33.0.2" "platform-tools" "ndk;22.0.7026061" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Build APK
        run: |
          cd ethereal-os
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.ndkVersion=22.0.7026061" >> gradle.properties
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "=== EXIT: ${PIPESTATUS[0]} ==="
          find . -name "*.apk" -type f
          echo "=== LAST ERROR LINES ==="
          grep -A 20 "What went wrong" /tmp/build.log || tail -60 /tmp/build.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eth-os-rsm-debug
          path: "**/*.apk"
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn
